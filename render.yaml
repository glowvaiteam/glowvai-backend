services:
  - type: web
    name: glowvai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --no-cache-dir -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"
